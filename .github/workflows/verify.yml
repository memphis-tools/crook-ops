name: verify-page
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: ./mvnw -q package

      - name: Install Playwright browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test page (fails on 500 or JS errors)
        run: npx playwright test

      - name: Deployment blocked
        if: failure()
        run: echo "index.html broken — do not deploy this commit"
